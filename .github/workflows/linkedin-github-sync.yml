name: Native LinkedIn & GitHub Sync

on:
  schedule:
    # Run every 6 hours automatically to check for new posts
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab or Webhook trigger
    inputs:
      post_title:
        description: 'LinkedIn Post Title'
        required: false
      post_link:
        description: 'LinkedIn Post URL'
        required: false
      post_summary:
        description: 'LinkedIn Post Summary'
        required: false

jobs:
  sync-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitHub Repos & LinkedIn Updates
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_RSS_URL: ${{ secrets.LINKEDIN_RSS_URL }}
          LINKEDIN_WEBHOOK_PAYLOAD: ${{ github.event.inputs.post_title && format('\{"title":"{0}","link":"{1}","summary":"{2}"\}', github.event.inputs.post_title, github.event.inputs.post_link, github.event.inputs.post_summary) || '' }}
        run: |
          echo "Checking latest LinkedIn activity for andrecodexvictor..."
          node scripts/sync-linkedin.js

      - name: Commit & Push if updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git diff --quiet || (git add public/data/live-updates.json && git commit -m "chore(sync): auto-update LinkedIn feed" && git push)
